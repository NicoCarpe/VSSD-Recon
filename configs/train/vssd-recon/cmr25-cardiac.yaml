data:
  class_path: pl_modules.DataModule
  init_args:
    slice_dataset: data.CmrxReconSliceDataset
    data_path: /home/nicocarp/scratch/VSSD-Recon/mridatasets/cmrxrecon2025
    challenge: multicoil
    # sample_rate: 0.2
    # val_sample_rate: 0.2
    # data_balancer:
    #   class_path: data.BalanceSampler
    #   init_args: 
    #     ratio_dict: {
    #       'T1map': 2, 'T2map': 6, 'cine_lax': 2, 'cine_sax': 1, 
    #       'cine_lvot': 6, 'aorta_sag': 1, 'aorta_tra': 1,'tagging': 1 
    #     }
    train_transform:
      class_path: data.CmrxReconDataTransform
      init_args:
        mask_func:
          class_path: data.CmrxRecon24MaskFunc
          init_args:
            num_low_frequencies: 
            - 20
            num_adj_slices: &num_adj_slices 5
            mask_path: /home/nicocarp/scratch/VSSD-Recon/mridatasets/cmrxrecon2025/mask/mask_radial.h5
        uniform_resolution: null
        use_seed: false
    val_transform:
      class_path: data.CmrxReconDataTransform
      init_args:
        mask_func:
          class_path: data.CmrxRecon24MaskFunc
          init_args:
            num_low_frequencies: 
            - 20
            num_adj_slices: *num_adj_slices
            mask_path: /home/nicocarp/scratch/VSSD-Recon/mridatasets/cmrxrecon2025/mask/mask_radial.h5
        uniform_resolution: null
        use_seed: True
    combine_train_val: false
    num_adj_slices: *num_adj_slices
    batch_size: 1
    num_workers: 0
    distributed_sampler: true
    use_dataset_cache_file: false

# dataset specific settings
trainer:
  # gradient_clip_algorithm: value
  # gradient_clip_val: 1.0

  strategy: ddp
  # strategy:
  #   class_path: lightning.pytorch.strategies.FSDPStrategy
  #   init_args:
  #     sharding_strategy: FULL_SHARD
  #     cpu_offload: true

  devices: 4
  num_nodes: 1
  max_epochs: 20

  # NOTE: automatic mixed precision seems to blow up the training
  precision: bf16-mixed

  # NOTE: probably don't want to have accumulate grad batches due to the heterogeneity of our dataset
  # accumulate_grad_batches: 2  # Real batch size is accum * batch_size, real steps/"epoch" is epoch_size / accum

  logger: 
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      save_dir: exp/cmr25-cardiac/VSSD-Recon # path to save experiment and checkpoint
      tags: [cmr25-cardiac]
      name: cmr25-cardiac-VSSD-Recon
model:
  class_path: pl_modules.PromptMrModule
  init_args:
    lr: 0.0002
    lr_step_size: 11

ckpt_path: null # add the path to the checkpoint if you want to resume training
